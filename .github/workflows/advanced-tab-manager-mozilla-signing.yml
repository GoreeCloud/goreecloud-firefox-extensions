name: Advanced Tab Manager Mozilla Signing

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/advanced-tab-manager-mozilla-signing.yml'

permissions:
  contents: read
  statuses: write

concurrency:
  group: advanced-tab-manager-mozilla-signing
  cancel-in-progress: false

env:
  ATM_RELEASE_VERSION: '0.1.11'
  ATM_RELEASE_CANDIDATE_SHA256: '9c0f44926ac1d2f213fd07f82dd18fa11bd54ceebc6cd871898fe82b962a5b02'

jobs:
  sign-and-restart:
    runs-on: ubuntu-latest
    steps:
      - name: Publish signing gate pending status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["GITHUB_SHA"]
          run_url = f"{os.environ['GITHUB_SERVER_URL']}/{repository}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repository}/statuses/{sha}",
              data=json.dumps({
                  "state": "pending",
                  "context": "goreecloud/advanced-tab-manager-mozilla-signing",
                  "description": "Mozilla signing and full-restart acceptance running",
                  "target_url": run_url,
              }).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
                  "User-Agent": "GoreeCloud-Advanced-Tab-Manager-Signing",
              },
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              if response.status not in {200, 201}:
                  raise SystemExit(f"could not publish pending signing status: HTTP {response.status}")
          PY

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: latest

      - uses: browser-actions/setup-geckodriver@latest

      - name: Bind signing to authoritative main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          main_sha="$(git rev-parse origin/main)"
          if [[ "$GITHUB_SHA" != "$main_sha" ]]; then
            echo '::error::Advanced Tab Manager signing must run from authoritative main.'
            echo "Workflow revision: $GITHUB_SHA"
            echo "Authoritative main: $main_sha"
            exit 1
          fi

      - name: Resolve exact release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python -c 'import json; print(json.load(open("extensions/advanced-tab-manager/manifest.json", encoding="utf-8"))["version"])')"
          if [[ "$VERSION" != "$ATM_RELEASE_VERSION" ]]; then
            echo "::error::Signing workflow is bound to $ATM_RELEASE_VERSION but source is $VERSION."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "ATM_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Validate exact source state
        run: |
          python shared/scripts/validate_repository.py
          python extensions/advanced-tab-manager/scripts/validate.py
          python -m py_compile             extensions/advanced-tab-manager/scripts/stable_security_review.py             extensions/advanced-tab-manager/scripts/glaze_consumer_qualification.py             extensions/advanced-tab-manager/tests/firefox_runtime_smoke.py             extensions/advanced-tab-manager/tests/signed_restart_smoke.py             extensions/advanced-tab-manager/tests/amo_signed_version_recovery.py             extensions/advanced-tab-manager/tests/verify_signed_xpi.py
          node --test extensions/advanced-tab-manager/tests/*.test.mjs
          node extensions/advanced-tab-manager/scripts/large-session-qualification.mjs

      - name: Build deterministic unsigned candidate
        run: python shared/scripts/package_extension.py advanced-tab-manager --output-dir dist/candidate

      - name: Bind exact candidate digest and stage signing source
        shell: bash
        run: |
          set -euo pipefail
          candidate="$(find dist/candidate -maxdepth 1 -type f -name 'goreecloud-advanced-tab-manager-*.xpi' -print -quit)"
          test -n "$candidate"
          mkdir -p signing-source dist/mozilla
          python - "$candidate" "$ATM_VERSION" "$GITHUB_SHA" "$ATM_RELEASE_CANDIDATE_SHA256" <<'PY'
          import hashlib
          import json
          import sys
          import zipfile
          from pathlib import Path

          candidate = Path(sys.argv[1])
          expected_version = sys.argv[2]
          source_revision = sys.argv[3]
          accepted_digest = sys.argv[4]
          digest = hashlib.sha256(candidate.read_bytes()).hexdigest()
          if digest != accepted_digest:
              raise SystemExit(f'accepted candidate digest mismatch: expected {accepted_digest}, rebuilt {digest}')
          with zipfile.ZipFile(candidate) as archive:
              bad = archive.testzip()
              if bad:
                  raise SystemExit(f'candidate archive integrity failure: {bad}')
              archive.extractall('signing-source')
          manifest = json.loads(Path('signing-source/manifest.json').read_text(encoding='utf-8'))
          addon_id = manifest.get('browser_specific_settings', {}).get('gecko', {}).get('id')
          if addon_id != 'advanced-tab-manager@goreecloud.com':
              raise SystemExit(f'unexpected Firefox add-on ID: {addon_id!r}')
          if manifest.get('version') != expected_version:
              raise SystemExit(f"unexpected candidate version: {manifest.get('version')!r}")
          Path('dist/candidate-sha256.txt').write_text(f'{digest}  {candidate.name}\n', encoding='utf-8')
          Path('dist/source-revision.txt').write_text(f'{source_revision}\n', encoding='utf-8')
          print(f'Candidate SHA-256: {digest}')
          print(f'Exact source revision: {source_revision}')
          PY
          unzip -t "$candidate"

      - name: Re-run Stable security qualification on signing revision
        run: |
          candidate="$(find dist/candidate -maxdepth 1 -type f -name 'goreecloud-advanced-tab-manager-*.xpi' -print -quit)"
          python extensions/advanced-tab-manager/scripts/stable_security_review.py             --xpi "$candidate"             --source-revision "$GITHUB_SHA"             --output dist/advanced-tab-manager-stable-security-review.json

      - name: Re-run GLAZE UI 1.5.1 consumer qualification on signing revision
        run: |
          python extensions/advanced-tab-manager/scripts/glaze_consumer_qualification.py             --source-revision "$GITHUB_SHA"             --output dist/advanced-tab-manager-glaze-1.5.1-acceptance.json

      - name: Require Mozilla Add-ons signing credentials
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${AMO_JWT_ISSUER}" || -z "${AMO_JWT_SECRET}" ]]; then
            echo '::error::Missing AMO_JWT_ISSUER and/or AMO_JWT_SECRET repository secrets.'
            exit 1
          fi

      - name: Submit exact candidate to Mozilla or recover existing signed version
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          set +e
          signing_output="$({ npx --yes web-ext@10.5.0 sign             --source-dir signing-source             --artifacts-dir dist/mozilla             --channel=unlisted             --approval-timeout=900000             --timeout=900000; } 2>&1)"
          signing_status=$?
          set -e
          printf '%s\n' "$signing_output"

          if [[ "$signing_status" -eq 0 ]]; then
            printf 'new-submission\n' > dist/mozilla-signing-source.txt
            exit 0
          fi

          if ! grep -Fq "Version ${ATM_VERSION} already exists." <<<"$signing_output"; then
            echo '::error::Mozilla signing failed for a reason other than an already-existing exact version.'
            exit "$signing_status"
          fi

          echo "Mozilla already has ${ATM_VERSION}; recovering the approved unlisted signed XPI."
          python extensions/advanced-tab-manager/tests/amo_signed_version_recovery.py             "$ATM_VERSION" dist/mozilla

      - name: Verify Mozilla-signed XPI parity and identity
        shell: bash
        run: |
          set -euo pipefail
          candidate="$(find dist/candidate -maxdepth 1 -type f -name 'goreecloud-advanced-tab-manager-*.xpi' -print -quit)"
          signed="$(find dist/mozilla -maxdepth 1 -type f -name '*.xpi' -print -quit)"
          test -n "$candidate"
          test -n "$signed"
          python extensions/advanced-tab-manager/tests/verify_signed_xpi.py             "$ATM_VERSION" "$candidate" "$signed"
          unzip -t "dist/goreecloud-advanced-tab-manager-${ATM_VERSION}-signed.xpi"

      - name: Install Selenium
        run: python -m pip install --disable-pip-version-check selenium

      - name: Persistent signed install and full Firefox restart acceptance
        env:
          ATM_SOURCE_REVISION: ${{ github.sha }}
        run: |
          python extensions/advanced-tab-manager/tests/signed_restart_smoke.py             "dist/goreecloud-advanced-tab-manager-${ATM_VERSION}-signed.xpi"

      - name: Build signed release evidence record
        shell: bash
        run: |
          set -euo pipefail
          python - "$GITHUB_SHA" "$GITHUB_RUN_ID" "$ATM_VERSION" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          source_revision, run_id, version = sys.argv[1:]
          candidate_line = Path('dist/candidate-sha256.txt').read_text(encoding='utf-8').strip()
          signed_line = Path('dist/signed-sha256.txt').read_text(encoding='utf-8').strip()
          signing_source = Path('dist/mozilla-signing-source.txt').read_text(encoding='utf-8').strip()
          parity = json.loads(Path('dist/signed-xpi-parity.json').read_text(encoding='utf-8'))
          restart = json.loads(Path('dist/advanced-tab-manager-signed-restart.json').read_text(encoding='utf-8'))
          glaze = json.loads(Path('dist/advanced-tab-manager-glaze-1.5.1-acceptance.json').read_text(encoding='utf-8'))
          security = json.loads(Path('dist/advanced-tab-manager-stable-security-review.json').read_text(encoding='utf-8'))
          inventory = json.loads(Path('docs/extension-inventory.json').read_text(encoding='utf-8'))
          entry = next((item for item in inventory.get('extensions', []) if item.get('slug') == 'advanced-tab-manager'), None)
          if entry is None or entry.get('source_version') != version:
              raise SystemExit('Advanced Tab Manager inventory/source version mismatch')
          stable_promoted = (
              entry.get('source_state') == 'stable'
              and entry.get('accepted_stable_version') == version
          )
          record = {
              'schemaVersion': 1,
              'product': 'GoreeCloud Advanced Tab Manager',
              'version': version,
              'sourceRevision': source_revision,
              'sourceState': entry.get('source_state'),
              'acceptedStableVersion': entry.get('accepted_stable_version'),
              'githubWorkflowRunId': int(run_id),
              'candidateSha256': candidate_line.split()[0],
              'signedSha256': signed_line.split()[0],
              'firefoxAddonId': 'advanced-tab-manager@goreecloud.com',
              'mozillaSigned': True,
              'mozillaSigningSource': signing_source,
              'signedNonManifestPayloadMatchesCandidateByteForByte': True,
              'signedManifestGovernedParityAccepted': True,
              'signedXpiParity': parity,
              'persistentInstallRestartAccepted': restart.get('persistentInstallRestartAccepted') is True,
              'signedRestartAcceptance': restart,
              'glazeConsumerAccepted': glaze.get('status') == 'accepted-v1',
              'stableSecurityBlockersPassed': security.get('applicableStableSecurityBlockers') == 'passed',
              'stablePromoted': stable_promoted,
          }
          amo_metadata = Path('dist/amo-existing-version-metadata.json')
          if amo_metadata.exists():
              record['amoExistingVersion'] = json.loads(amo_metadata.read_text(encoding='utf-8'))
          Path('dist/advanced-tab-manager-signing-evidence.json').write_text(
              json.dumps(record, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps(record, indent=2, sort_keys=True))
          PY

      - name: Retain signed release evidence
        uses: actions/upload-artifact@v4
        with:
          name: goreecloud-advanced-tab-manager-${{ steps.version.outputs.version }}-mozilla-signed
          retention-days: 30
          if-no-files-found: error
          path: |
            dist/goreecloud-advanced-tab-manager-*-signed.xpi
            dist/candidate-sha256.txt
            dist/signed-sha256.txt
            dist/source-revision.txt
            dist/mozilla-signing-source.txt
            dist/amo-existing-version-metadata.json
            dist/signed-xpi-parity.json
            dist/advanced-tab-manager-signed-restart.json
            dist/advanced-tab-manager-glaze-1.5.1-acceptance.json
            dist/advanced-tab-manager-stable-security-review.json
            dist/advanced-tab-manager-signing-evidence.json

      - name: Publish authoritative signing gate result
        if: ${{ always() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          job_status = os.environ.get("JOB_STATUS", "failure")
          state = "success" if job_status == "success" else ("error" if job_status == "cancelled" else "failure")
          description = "Mozilla signing/full-restart gate passed" if state == "success" else "Mozilla signing/full-restart gate failed"
          signed = Path("dist/signed-sha256.txt")
          if state == "success" and signed.is_file():
              digest = signed.read_text(encoding="utf-8").strip().split()[0]
              if len(digest) == 64:
                  description = f"Passed · signed {digest[:12]}"
          repository = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["GITHUB_SHA"]
          run_url = f"{os.environ['GITHUB_SERVER_URL']}/{repository}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repository}/statuses/{sha}",
              data=json.dumps({
                  "state": state,
                  "context": "goreecloud/advanced-tab-manager-mozilla-signing",
                  "description": description,
                  "target_url": run_url,
              }).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
                  "User-Agent": "GoreeCloud-Advanced-Tab-Manager-Signing",
              },
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              if response.status not in {200, 201}:
                  raise SystemExit(f"could not publish final signing status: HTTP {response.status}")
          PY
