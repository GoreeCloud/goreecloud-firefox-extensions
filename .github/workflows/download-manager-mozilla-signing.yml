name: Download Manager Mozilla Signing

on:
  workflow_dispatch:
  push:
    branches:
      - 'release/download-manager-signing'

permissions:
  contents: read

concurrency:
  group: download-manager-mozilla-signing
  cancel-in-progress: false

jobs:
  sign-and-restart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: latest

      - uses: browser-actions/setup-geckodriver@latest

      - name: Bind automated signing branch to authoritative main
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          main_sha="$(git rev-parse origin/main)"
          if [[ "$GITHUB_SHA" != "$main_sha" ]]; then
            echo '::error::The automated Download Manager signing branch must point exactly at authoritative main.'
            echo "Signing branch: $GITHUB_SHA"
            echo "Authoritative main: $main_sha"
            exit 1
          fi

      - name: Resolve Download Manager version
        id: version
        shell: bash
        run: |
          VERSION="$(python -c 'import json; print(json.load(open("extensions/download-manager/manifest.json", encoding="utf-8"))["version"])')"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "DOWNLOAD_MANAGER_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Validate exact source candidate
        shell: bash
        run: |
          set -euo pipefail
          python shared/scripts/validate_repository.py
          python -m py_compile \
            extensions/download-manager/scripts/native-host/goreecloud_download_manager_native.py \
            extensions/download-manager/tests/signed_restart_smoke.py
          python -m unittest discover -s extensions/download-manager/tests -p 'test_*.py'
          node extensions/download-manager/tests/test_browser_scheduler.js
          node extensions/download-manager/tests/test_mixed_scheduler.js
          node extensions/download-manager/tests/test_lifecycle_faults.js
          node extensions/download-manager/tests/test_retry_snapshots.js
          find extensions/download-manager -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do
            node --check "$file"
          done

      - name: Build deterministic unsigned candidate
        run: python shared/scripts/package_extension.py download-manager --output-dir dist/candidate

      - name: Stage exact candidate for Mozilla signing
        shell: bash
        run: |
          set -euo pipefail
          candidate="$(find dist/candidate -maxdepth 1 -type f -name 'goreecloud-download-manager-*.xpi' -print -quit)"
          test -n "$candidate"
          mkdir -p signing-source dist/mozilla
          python - "$candidate" "$DOWNLOAD_MANAGER_VERSION" "$GITHUB_SHA" <<'PY'
          import hashlib
          import json
          import sys
          import zipfile
          from pathlib import Path

          candidate = Path(sys.argv[1])
          expected_version = sys.argv[2]
          source_revision = sys.argv[3]
          stage = Path('signing-source')
          with zipfile.ZipFile(candidate) as archive:
              bad = archive.testzip()
              if bad:
                  raise SystemExit(f'candidate archive integrity failure: {bad}')
              archive.extractall(stage)
          manifest = json.loads((stage / 'manifest.json').read_text(encoding='utf-8'))
          addon_id = manifest.get('browser_specific_settings', {}).get('gecko', {}).get('id')
          if addon_id != 'download-manager@goreecloud.com':
              raise SystemExit(f'unexpected Firefox add-on ID: {addon_id!r}')
          if manifest.get('version') != expected_version:
              raise SystemExit(f"unexpected candidate version: {manifest.get('version')} (expected {expected_version})")
          digest = hashlib.sha256(candidate.read_bytes()).hexdigest()
          Path('dist/candidate-sha256.txt').write_text(f'{digest}  {candidate.name}\n', encoding='utf-8')
          Path('dist/source-revision.txt').write_text(f'{source_revision}\n', encoding='utf-8')
          print(f'Candidate SHA-256: {digest}')
          print(f'Exact source revision: {source_revision}')
          PY
          unzip -t "$candidate"

      - name: Require Mozilla Add-ons signing credentials
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${AMO_JWT_ISSUER}" || -z "${AMO_JWT_SECRET}" ]]; then
            echo '::error::Missing AMO_JWT_ISSUER and/or AMO_JWT_SECRET repository secrets.'
            echo 'Create Mozilla Add-ons API credentials and store them as repository secrets before rerunning this workflow.'
            exit 1
          fi

      - name: Submit exact candidate to Mozilla or recover existing signed version
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          set +e
          signing_output="$({ npx --yes web-ext@10.5.0 sign \
            --source-dir signing-source \
            --artifacts-dir dist/mozilla \
            --channel=unlisted \
            --approval-timeout=900000 \
            --timeout=900000; } 2>&1)"
          signing_status=$?
          set -e
          printf '%s\n' "$signing_output"

          if [[ "$signing_status" -eq 0 ]]; then
            printf 'new-submission\n' > dist/mozilla-signing-source.txt
            exit 0
          fi

          if ! grep -Fq "Version ${DOWNLOAD_MANAGER_VERSION} already exists." <<<"$signing_output"; then
            echo '::error::Mozilla signing failed for a reason other than an already-existing exact version.'
            exit "$signing_status"
          fi

          echo "Mozilla already has version ${DOWNLOAD_MANAGER_VERSION}; retrieving that approved version for signed-XPI and exact-payload verification."
          python - "$DOWNLOAD_MANAGER_VERSION" <<'PY'
          import base64
          import hashlib
          import hmac
          import json
          import os
          import sys
          import time
          import uuid
          from pathlib import Path
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          version = sys.argv[1]
          addon_id = 'download-manager@goreecloud.com'
          issuer = os.environ['AMO_JWT_ISSUER']
          secret = os.environ['AMO_JWT_SECRET'].encode('utf-8')

          def b64url(value: bytes) -> str:
              return base64.urlsafe_b64encode(value).rstrip(b'=').decode('ascii')

          now = int(time.time())
          header = {'alg': 'HS256', 'typ': 'JWT'}
          payload = {
              'iss': issuer,
              'jti': str(uuid.uuid4()),
              'iat': now,
              'exp': now + 60,
          }
          encoded_header = b64url(json.dumps(header, separators=(',', ':')).encode('utf-8'))
          encoded_payload = b64url(json.dumps(payload, separators=(',', ':')).encode('utf-8'))
          signing_input = f'{encoded_header}.{encoded_payload}'.encode('ascii')
          signature = b64url(hmac.new(secret, signing_input, hashlib.sha256).digest())
          token = f'{encoded_header}.{encoded_payload}.{signature}'

          detail_url = (
              'https://addons.mozilla.org/api/v5/addons/addon/'
              f'{quote(addon_id, safe="")}/versions/{quote(version, safe="")}/'
          )
          detail_request = Request(
              detail_url,
              headers={
                  'Authorization': f'JWT {token}',
                  'Accept': 'application/json',
                  'User-Agent': 'GoreeCloud-Download-Manager-Signing-Acceptance/1.0',
              },
          )
          with urlopen(detail_request, timeout=60) as response:
              detail = json.load(response)

          if detail.get('version') != version:
              raise SystemExit(f"AMO version mismatch: {detail.get('version')!r}")
          if detail.get('channel') != 'unlisted':
              raise SystemExit(f"AMO version is not unlisted: {detail.get('channel')!r}")
          file_info = detail.get('file') or {}
          if str(file_info.get('status', '')).lower() != 'public':
              raise SystemExit(f"AMO existing file is not approved/public: {file_info.get('status')!r}")
          download_url = file_info.get('url')
          if not isinstance(download_url, str) or not download_url.startswith('https://'):
              raise SystemExit(f'AMO existing file has invalid download URL: {download_url!r}')

          # AMO's is_mozilla_signed_extension flag means Mozilla's internal-certificate
          # class, not ordinary AMO signing. Ordinary signed WebExtensions can report
          # false here. The release gate therefore relies on approved status, the AMO
          # file hash, XPI signature metadata, exact payload parity, and Firefox's own
          # persistent-install acceptance rather than treating this flag as required.
          internal_certificate = file_info.get('is_mozilla_signed_extension')
          print(f'AMO internal-certificate flag (informational): {internal_certificate!r}')

          download_request = Request(
              download_url,
              headers={'User-Agent': 'GoreeCloud-Download-Manager-Signing-Acceptance/1.0'},
          )
          with urlopen(download_request, timeout=120) as response:
              signed_bytes = response.read()

          expected_hash = file_info.get('hash')
          actual_hash = hashlib.sha256(signed_bytes).hexdigest()
          if not isinstance(expected_hash, str) or not expected_hash.startswith('sha256:'):
              raise SystemExit(f'AMO existing file is missing a SHA-256 hash: {expected_hash!r}')
          if expected_hash.split(':', 1)[1].lower() != actual_hash:
              raise SystemExit(
                  f'AMO signed-file hash mismatch: api={expected_hash} downloaded=sha256:{actual_hash}'
              )

          target = Path('dist/mozilla') / f'existing-{version}.xpi'
          target.write_bytes(signed_bytes)
          Path('dist/mozilla-signing-source.txt').write_text('existing-version\n', encoding='utf-8')
          Path('dist/amo-existing-version-metadata.json').write_text(
              json.dumps(
                  {
                      'version': version,
                      'channel': detail.get('channel'),
                      'fileId': file_info.get('id'),
                      'fileStatus': file_info.get('status'),
                      'fileHash': expected_hash,
                      'internalCertificateFlag': internal_certificate,
                  },
                  indent=2,
                  sort_keys=True,
              ) + '\n',
              encoding='utf-8',
          )
          print(f'Retrieved existing approved AMO version {version}: sha256:{actual_hash}')
          PY

      - name: Normalize and inspect Mozilla-signed XPI
        shell: bash
        run: |
          set -euo pipefail
          python - "$DOWNLOAD_MANAGER_VERSION" <<'PY'
          import hashlib
          import json
          import shutil
          import sys
          import zipfile
          from pathlib import Path

          version = sys.argv[1]
          files = sorted(Path('dist/mozilla').glob('*.xpi'))
          if len(files) != 1:
              raise SystemExit(f'expected exactly one Mozilla-signed XPI, found: {files}')
          source = files[0]
          target = Path(f'dist/goreecloud-download-manager-{version}-signed.xpi')
          shutil.copy2(source, target)

          candidate_files = sorted(Path('dist/candidate').glob('goreecloud-download-manager-*.xpi'))
          if len(candidate_files) != 1:
              raise SystemExit(f'expected exactly one deterministic unsigned candidate, found: {candidate_files}')
          candidate = candidate_files[0]

          with zipfile.ZipFile(candidate) as unsigned_archive, zipfile.ZipFile(target) as signed_archive:
              bad = signed_archive.testzip()
              if bad:
                  raise SystemExit(f'signed XPI integrity failure: {bad}')
              signed_names = signed_archive.namelist()
              if 'manifest.json' not in signed_names:
                  raise SystemExit('signed XPI is missing manifest.json')
              signature_files = {
                  name for name in signed_names
                  if name.startswith('META-INF/') and not name.endswith('/')
              }
              if not signature_files:
                  raise SystemExit('signed XPI does not contain Mozilla signature metadata')

              unsigned_payload_names = sorted(
                  name for name in unsigned_archive.namelist() if not name.endswith('/')
              )
              signed_payload_names = sorted(
                  name for name in signed_names if not name.startswith('META-INF/') and not name.endswith('/')
              )
              if signed_payload_names != unsigned_payload_names:
                  raise SystemExit(
                      'Mozilla-signed XPI payload inventory differs from the deterministic unsigned candidate: '
                      f'unsigned={unsigned_payload_names!r} signed={signed_payload_names!r}'
                  )
              for name in unsigned_payload_names:
                  if signed_archive.read(name) != unsigned_archive.read(name):
                      raise SystemExit(f'Mozilla-signed XPI changed runtime payload bytes for {name}')

              manifest = json.loads(signed_archive.read('manifest.json').decode('utf-8'))
              addon_id = manifest.get('browser_specific_settings', {}).get('gecko', {}).get('id')
              if addon_id != 'download-manager@goreecloud.com':
                  raise SystemExit(f'signed XPI changed Firefox add-on ID: {addon_id!r}')
              if manifest.get('version') != version:
                  raise SystemExit(f"signed XPI changed version: {manifest.get('version')!r}")

          digest = hashlib.sha256(target.read_bytes()).hexdigest()
          Path('dist/signed-sha256.txt').write_text(f'{digest}  {target.name}\n', encoding='utf-8')
          print(f'Mozilla signature metadata files: {sorted(signature_files)!r}')
          print('Mozilla-signed runtime payload matches deterministic unsigned candidate byte-for-byte.')
          print(f'Signed SHA-256: {digest}')
          PY
          unzip -t "dist/goreecloud-download-manager-${DOWNLOAD_MANAGER_VERSION}-signed.xpi"

      - name: Install matching 0.2.10 native helper
        run: ./extensions/download-manager/scripts/install-native-host-linux.sh

      - name: Install Selenium
        run: python -m pip install --disable-pip-version-check selenium

      - name: Persistent signed install and full-browser native recovery acceptance
        shell: bash
        run: |
          set -o pipefail
          python extensions/download-manager/tests/signed_restart_smoke.py \
            "dist/goreecloud-download-manager-${DOWNLOAD_MANAGER_VERSION}-signed.xpi" \
            | tee dist/signed-restart-acceptance.txt

      - name: Build signing evidence record
        shell: bash
        run: |
          set -euo pipefail
          python - "$GITHUB_SHA" "$GITHUB_RUN_ID" "$DOWNLOAD_MANAGER_VERSION" <<'PY'
          import json
          import sys
          from pathlib import Path

          source_revision, run_id, version = sys.argv[1:]
          candidate_line = Path('dist/candidate-sha256.txt').read_text(encoding='utf-8').strip()
          signed_line = Path('dist/signed-sha256.txt').read_text(encoding='utf-8').strip()
          signing_source = Path('dist/mozilla-signing-source.txt').read_text(encoding='utf-8').strip()
          record = {
              'schemaVersion': 1,
              'product': 'GoreeCloud Download Manager Extension',
              'version': version,
              'sourceRevision': source_revision,
              'githubWorkflowRunId': int(run_id),
              'candidateSha256': candidate_line.split()[0],
              'signedSha256': signed_line.split()[0],
              'firefoxAddonId': 'download-manager@goreecloud.com',
              'nativeHost': 'goreecloud_download_manager',
              'mozillaSigned': True,
              'mozillaSigningSource': signing_source,
              'signedPayloadMatchesCandidate': True,
              'persistentInstallRestartAccepted': True,
              'fullBrowserNativeRecoveryAccepted': True,
              'stablePromoted': False,
          }
          Path('dist/download-manager-signing-evidence.json').write_text(
              json.dumps(record, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps(record, indent=2, sort_keys=True))
          PY

      - name: Retain signed release evidence
        uses: actions/upload-artifact@v4
        with:
          name: goreecloud-download-manager-${{ steps.version.outputs.version }}-mozilla-signed
          retention-days: 30
          if-no-files-found: error
          path: |
            dist/goreecloud-download-manager-*-signed.xpi
            dist/candidate-sha256.txt
            dist/signed-sha256.txt
            dist/source-revision.txt
            dist/mozilla-signing-source.txt
            dist/amo-existing-version-metadata.json
            dist/signed-restart-acceptance.txt
            dist/download-manager-signing-evidence.json
