name: Privacy Shield Firefox Runtime

on:
  pull_request:
    paths:
      - 'extensions/privacy-shield/**'
      - 'shared/scripts/package_extension.py'
      - '.github/workflows/privacy-shield-firefox-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: latest
      - uses: browser-actions/setup-geckodriver@latest
      - name: Install Selenium
        run: python -m pip install --disable-pip-version-check selenium
      - name: Package Privacy Shield unsigned XPI
        run: python shared/scripts/package_extension.py privacy-shield
      - name: Resolve packaged Privacy Shield XPI
        shell: bash
        run: |
          VERSION="$(python -c 'import json; print(json.load(open("extensions/privacy-shield/manifest.json", encoding="utf-8"))["version"])')"
          XPI="dist/goreecloud-privacy-shield-${VERSION}.xpi"
          test -f "$XPI"
          echo "PRIVACY_SHIELD_XPI=$XPI" >> "$GITHUB_ENV"
      - name: Route test-only third-party and reviewed site hosts locally
        shell: bash
        run: |
          echo '127.0.0.1 google-analytics.com doubleclick.net coinhive.com cdn.jsdelivr.net reddit.com www.reddit.com pinterest.com www.pinterest.com' | sudo tee -a /etc/hosts
      - name: Run real Firefox runtime smoke suite
        run: python extensions/privacy-shield/tests/runtime_smoke.py "$PRIVACY_SHIELD_XPI"
      - name: Force MV3 event-page termination and verify wake recovery
        run: python extensions/privacy-shield/tests/event_page_recovery_smoke.py "$PRIVACY_SHIELD_XPI"
