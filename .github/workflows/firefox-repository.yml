name: Firefox Repository

on:
  pull_request:
    paths:
      - 'extensions/**'
      - 'shared/**'
      - 'docs/extension-inventory.json'
      - '.github/workflows/firefox-repository.yml'
  push:
    branches: [main]
    paths:
      - 'extensions/**'
      - 'shared/**'
      - 'docs/extension-inventory.json'
      - '.github/workflows/firefox-repository.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate canonical extension inventory and manifests
        run: python shared/scripts/validate_repository.py
      - name: Validate Advanced Tab Manager source contract
        run: python extensions/advanced-tab-manager/scripts/validate.py
      - name: Test Advanced Tab Manager state core
        run: node --test extensions/advanced-tab-manager/tests/*.test.mjs
      - name: Qualify Advanced Tab Manager deterministic large-session core
        run: node extensions/advanced-tab-manager/scripts/large-session-qualification.mjs
      - name: Validate Webspaces source contract
        run: python extensions/webspaces/scripts/validate.py
      - name: Test Webspaces routing and management core
        run: node --experimental-default-type=module --test extensions/webspaces/tests/*.test.js
      - name: Validate Privacy Shield source contract
        run: python extensions/privacy-shield/scripts/validate.py
      - name: Validate Privacy Shield target acceptance source contract
        run: python extensions/privacy-shield/scripts/validate_target_acceptance_source.py
      - name: Test Privacy Shield core behavior
        run: node extensions/privacy-shield/scripts/test_core.js
      - name: Test Privacy Shield site profiles
        run: node extensions/privacy-shield/scripts/test_site_profiles.js
      - name: Test Privacy Shield support snapshots
        run: node extensions/privacy-shield/scripts/test_support_snapshot.js
      - name: Test Privacy Shield target acceptance evidence contract
        run: python extensions/privacy-shield/scripts/test_target_acceptance.py
      - name: Test Privacy Shield logger privacy
        run: node extensions/privacy-shield/scripts/test_logger_privacy.js
      - name: Test Privacy Shield unified background activity
        run: node extensions/privacy-shield/scripts/test_background_activity.js
      - name: Check maintained JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find extensions -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do
            node --check "$file"
          done
      - name: Build deterministic unsigned packages
        run: |
          python shared/scripts/package_extension.py advanced-tab-manager
          python shared/scripts/package_extension.py redirector
          python shared/scripts/package_extension.py source-resync
          python shared/scripts/package_extension.py privacy-shield
          python shared/scripts/package_extension.py webspaces
      - name: Record Advanced Tab Manager unsigned package checksum
        shell: bash
        run: |
          set -euo pipefail
          sha256sum dist/goreecloud-advanced-tab-manager-*.xpi > dist/goreecloud-advanced-tab-manager-${{ github.event.pull_request.head.sha || github.sha }}.sha256
      - name: Verify package archives
        shell: bash
        run: |
          set -euo pipefail
          for package in dist/*.xpi; do
            unzip -t "$package"
            unzip -l "$package"
          done
      - name: Publish Advanced Tab Manager candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: goreecloud-advanced-tab-manager-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            dist/goreecloud-advanced-tab-manager-*.xpi
            dist/goreecloud-advanced-tab-manager-${{ github.event.pull_request.head.sha || github.sha }}.sha256
            dist/advanced-tab-manager-large-session-qualification.json
          if-no-files-found: error
          retention-days: 14
      - name: Publish Webspaces unsigned test package
        uses: actions/upload-artifact@v4
        with:
          name: goreecloud-webspaces-${{ github.sha }}
          path: dist/goreecloud-webspaces-*.xpi
          if-no-files-found: error
          retention-days: 14
