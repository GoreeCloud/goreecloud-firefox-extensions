<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GoreeCloud Advanced Tab Manager</title>
  <link rel="stylesheet" href="sidebar.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div><p class="eyebrow">GoreeCloud</p><h1>Advanced Tab Manager</h1></div>
      <button id="refresh" class="icon-button" type="button" aria-label="Refresh live browser state">↻</button>
    </header>
    <div class="controls">
      <label class="search-field"><span class="sr-only">Search open tabs</span><input id="search" type="search" autocomplete="off" placeholder="Search tabs, URLs, groups…"></label>
      <label class="view-field"><span class="sr-only">Sidebar view</span><select id="view-mode" aria-label="Sidebar view"><option value="tree">Tree view</option><option value="groups">Native groups</option></select></label>
    </div>
    <section id="summary" class="summary" aria-live="polite"></section>
    <section id="content" class="content" aria-live="polite"></section>
  </main>
  <script type="module" src="sidebar.js"></script>
</body>
</html>
